<section>
  <form>
    <input #inputRef type="text" placeholder="Enter text for demo" />
    <button class="primary" type="button" (click)="addDemo(inputRef.value)">Enter</button>
  </form>
</section>
<section class="results">
  @for (demoResult of demoResults(); track $index) {
    <app-demo-display [demoResult]="demoResult"></app-demo-display>
  }
</section>
