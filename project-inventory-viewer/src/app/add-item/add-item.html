<div class="add-item">
  <form [formGroup]="addItemForm" (ngSubmit)="onSubmit()">
    <h2>Add Item</h2>
    <label [class.shouldNotDisplay]="shouldNotDisplayLocation()" for="location">Location:</label>
    <select
      [class.shouldNotDisplay]="shouldNotDisplayLocation()"
      formControlName="location"
      id="location"
    >
      <option value="fridge">Fridge</option>
      <option value="freezer">Freezer</option>
      <option value="pantry">Pantry</option>
    </select>

    <label for="name">Item Name:</label>
    <input id="name" type="text" formControlName="name" placeholder="pickles" />

    <label for="quantity">Quantity:</label>
    <input id="quantity" type="number" formControlName="quantity" />

    <label for="expiration_date">Expiration Date:</label>
    <input id="expiration_date" type="date" formControlName="expiration_date" />

    <p [class.shouldNotDisplay]="isNotDevSituation()">
      Can't submit because of name: {{ addItemForm.controls.name.status }} location:
      {{ addItemForm.controls.location.status }} quantity:
      {{ addItemForm.controls.quantity.status }} expiration_date:
      {{ addItemForm.controls.expiration_date.status }}
    </p>

    <button type="submit" [disabled]="!addItemForm.valid">Submit</button>
  </form>
</div>
